<main class="wrap pad" id="main"><div id="viewHead"></div><div id="viewBody"><div class="empty"><p>Loading…</p></div></div></main>
<div id="sheetWrap" hidden><div class="scrim" data-act="close"></div><aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside></div>

<script>
/*LOGIC-START*/
const TYPES=[{id:1,k:"EQUIPMENT"},{id:2,k:"ACCESSORIES"},{id:3,k:"EXPENDABLE"},{id:4,k:"TRANSPORT"},{id:5,k:"CREW"},{id:6,k:"SUBRENT"},{id:7,k:"FREELANCE"}];
const STOCKED_TYPES=[1,2,4];                 // physical items we own and can double-book
const STATUSES=["Quote","Order","Approve","Shipped","Returned","Draft INV"];
const BLOCKING=["Order","Approve","Shipped"];  // these hold stock; Quote only warns
const OPEN=["Quote","Order","Approve","Shipped","Returned"];
const r2=n=>Math.round((+n||0)*100)/100;
function pD(s){const [y,m,d]=String(s).slice(0,10).split("-").map(Number);return Date.UTC(y,m-1,d);}
function spanDays(a,b){ if(!a||!b) return 0; const n=Math.round((pD(b)-pD(a))/864e5)+1; return n>0?n:0; }
/* Daily: every calendar day counts. Weekly: each full week charges `dpw` days, leftover days charge up to `dpw`. */
function chargeDays(a,b,rentType,dpw){ const n=spanDays(a,b); if(rentType!=="Weekly"||!(+dpw>0)) return n; const w=Math.floor(n/7), rem=n%7; return w*(+dpw)+Math.min(rem,+dpw); }
/* Customer discount applies only to discountable items; maxDisc>0 caps it (0 = no cap, as in the old system). */
function defaultDisc(prod,custDisc){ if(!prod||!prod.discountable) return 0; const c=Math.max(0,Math.min(100,+custDisc||0)); return prod.maxDisc>0?Math.min(c,prod.maxDisc):c; }
function lineCalc(l){
  /* Package parts are usually free (list 0) but the old system lets a part carry its own price, e.g. cable guards inside a generator package. */
  const price=(l.foc||l.sb)?0:(+l.list||0);
  let amount=price*(+l.qty||0)*(+l.days||0);
  if(l.t===5||l.t===7) amount+= (+l.otRate||0)*(+l.ot||0)*(+l.qty||0);   // crew and freelance both bill OT
  amount=r2(amount);
  const d=Math.max(0,Math.min(100,+l.disc||0));
  const total=r2(amount*(1-d/100));
  return {amount,total,disc:r2(amount-total)};
}
function typeTotals(lines,t){ let list=0,disc=0,sub=0; for(const l of lines){ if(l.t!==t) continue; const c=lineCalc(l); list+=c.amount; disc+=c.disc; sub+=c.total; } return {list:r2(list),disc:r2(disc),sub:r2(sub)}; }
function orderTotals(lines,o){
  let list=0,disc=0,sub=0; for(const l of lines){ const c=lineCalc(l); list+=c.amount; disc+=c.disc; sub+=c.total; }
  list=r2(list); disc=r2(disc); sub=r2(sub);
  const xp=Math.max(0,Math.min(100,+(o&&o.extraDisc)||0)); const extra=r2(sub*xp/100);
  const ins=r2(+(o&&o.insurance)||0);
  const adj=r2(+(o&&o.adjust)||0);             // "Adjust Grand Total": a fixed amount added to (or taken off) the sub total
  const base=r2(sub-extra+adj+ins);
  const vat=(o&&o.tax==="Not Vat")?0:r2(base*0.07);
  return {list,disc,sub,extra,adj,ins,base,vat,total:r2(base+vat)};
}
/* How many units of each stocked product an order holds (children included). */
function usageOf(lines){ const m={}; for(const l of lines){ if(!STOCKED_TYPES.includes(l.t)||!l.pid) continue; m[l.pid]=(m[l.pid]||0)+(+l.qty||0); } return Object.entries(m).map(([p,q])=>[+p,q]); }
function overlaps(o,a,b,today){ if(!o.ship||!o.ret) return false; let e=o.ret; if(o.status==="Shipped"&&today&&e<today) e=today; return o.ship<=b&&e>=a; }
function bookedQty(pid,a,b,orders,exclId,today,statuses){ let n=0; for(const o of orders){ if(o.id===exclId||!(statuses||BLOCKING).includes(o.status)||!overlaps(o,a,b,today)) continue; for(const [p,q] of (o.usage||[])) if(p===pid) n+=q; } return n; }
/* Package: adding a parent adds children at qty×ratio, priced 0, linked by parent key. */
function expandKit(parentLine,kit,catalog,newKey){ return (kit||[]).map(([cid,ratio,price])=>{ const c=catalog.get(cid); return {k:newKey(),t:parentLine.t,pid:cid,code:c?c.code:"",desc:c?c.desc:"",list:+price||0,qty:(+parentLine.qty||0)*(+ratio||1),ratio:+ratio||1,days:parentLine.days,disc:0,foc:false,sb:false,start:parentLine.start,end:parentLine.end,parent:parentLine.k,remark:""}; }); }
function syncChildren(lines){ const byK=new Map(lines.map(l=>[l.k,l])); for(const l of lines){ if(!l.parent) continue; const p=byK.get(l.parent); if(!p) continue; l.qty=(+p.qty||0)*(+l.ratio||1); l.days=p.days; l.start=p.start; l.end=p.end; } return lines; }
/* Status rules. Returns null when allowed, else a reason key. */
const MOVES={Quote:["Order"],Order:["Approve","Quote"],Approve:["Shipped","Order"],Shipped:["Returned"],Returned:["Draft INV"]};
const MOVE_ROLES={"Quote>Order":["sale"],"Order>Quote":["sale"],"Order>Approve":["sale"],"Approve>Order":["sale"],"Approve>Shipped":["store"],"Shipped>Returned":["store"],"Returned>Draft INV":["accounting"]};
function moveCheck(role,o,to,lines,issues){
  if(to==="Cancel"){ if(!["Quote","Order","Approve"].includes(o.status)) return "rNoCancel"; return (role==="admin"||role==="sale")?null:"rRole"; }
  if(!(MOVES[o.status]||[]).includes(to)) return "rFlow";
  const key=o.status+">"+to; if(role!=="admin"&&!(MOVE_ROLES[key]||[]).includes(role)) return "rRole";
  if(to==="Order"||to==="Approve"){ if(!o.customerName) return "rNeedCust"; if(!o.ship||!o.ret) return "rNeedDates"; if(!lines.length) return "rNeedItems"; if(issues&&issues.length) return "rClash"; }
  if(to==="Shipped"){ if(lines.some(l=>STOCKED_TYPES.includes(l.t)&&(+l.out||0)<(+l.qty||0))) return "rCheckOut"; }
  if(to==="Returned"){ if(lines.some(l=>STOCKED_TYPES.includes(l.t)&&((+l.in||0)+(+l.lost||0))<(+l.out||0))) return "rCheckIn"; }
  return null;
}
function canEditLines(role,status){ if(role==="admin") return ["Quote","Order","Approve"].includes(status); if(role==="sale") return ["Quote","Order"].includes(status); return false; }
/* Order numbers follow the old system: 2-digit Thai year + 5-digit running number (e.g. 6902255). */
function orderNo(beYear2,seq){ return String(beYear2).padStart(2,"0")+String(seq).padStart(5,"0"); }
/* ---------- CEO cockpit: checks and figures over the synced jobs ---------- */
function addDays_(s,n){ const t=pD(s)+n*864e5; const d=new Date(t); return d.toISOString().slice(0,10); }
function eachDay(a,b,fn){ if(!a||!b||b<a) return; let d=a, guard=0; while(d<=b&&guard++<400){ fn(d); d=addDays_(d,1); } }
const netOf=o=>{ const t=o.totals||{}; return r2((+t.sub||0)-(+t.extra||0)+(+t.adj||0)); };
function diagnose(orders,linesById,cat,today,opt){
  opt=opt||{}; const horizon=addDays_(today,opt.horizonDays||90), staleDays=opt.staleDays||30;
  const P=[]; const add=(kind,sev,o,msg,extra)=>P.push({kind,sev,no:o?o.no:null,id:o?o.id:null,msg,...(extra||{})});
  const open=orders.filter(o=>OPEN.includes(o.status));
  // 1 overbooking: stocked items held by Order/Approve/Shipped jobs beyond stock, from today on
  const perDay={}; // pid -> date -> [qty, [nos]]
  for(const o of open){ if(!BLOCKING.includes(o.status)||!o.ship||!o.ret) continue; let s=o.ship<today?today:o.ship, e=o.ret; if(o.status==="Shipped"&&e<today) e=today; if(e>horizon) e=horizon;
    for(const [pid,q] of (o.usage||[])){ const pp=cat.get(+pid); if(pp&&/^hour\s/i.test(String(pp.desc||"").trim())) continue; /* fuel-hour items count hours, not units */ eachDay(s,e,d=>{ const m=(perDay[pid]=perDay[pid]||{}); const c=(m[d]=m[d]||[0,[]]); c[0]+=q; if(!c[1].includes(o.no)) c[1].push(o.no); }); } }
  for(const [pid,days] of Object.entries(perDay)){ const p=cat.get(+pid); const stock=p?(+p.stock||0):0; let worst=null, first=null, last=null;
    for(const [d,[q,nos]] of Object.entries(days)) if(q>stock){ if(!first||d<first) first=d; if(!last||d>last) last=d; if(!worst||q-stock>worst.over) worst={over:q-stock,nos,q}; }
    if(worst) add("overbook","high",null,"",{pid:+pid,code:p?p.code:String(pid),desc:p?p.desc:"",stock,need:worst.q,over:worst.over,from:first,to:last,nos:worst.nos}); }
  // 2 overdue returns, 3 stale jobs, 4 totals that disagree with the old system, 5 adjust used, 6 missing details
  for(const o of open){
    if(o.status==="Shipped"&&o.ret&&o.ret<today) add("overdue","high",o,"",{ret:o.ret,days:spanDays(o.ret,today)-1});
    const ageRef=o.ret||o.ship; if(["Order","Approve","Returned"].includes(o.status)&&ageRef&&spanDays(ageRef,today)-1>staleDays) add("stale","med",o,"",{ret:ageRef,days:spanDays(ageRef,today)-1,status:o.status});
    if(o.legacyTotals&&o.legacyTotals.sub!=null&&Math.abs((+o.legacyTotals.sub)-netOf(o))>0.05) add("mismatch","high",o,"",{legacy:+o.legacyTotals.sub,lines:netOf(o)});
    if(Math.abs(+o.adjust||0)>=1) add("adjust","low",o,"",{adjust:+o.adjust});
    if(["Order","Approve"].includes(o.status)){ const miss=[]; if(!o.sale) miss.push("sale"); if(!o.customerName) miss.push("customer"); if(!o.ship||!o.ret) miss.push("dates"); if(miss.length) add("missing","med",o,"",{miss}); }
  }
  // 7 discount rule breaks, 8 price changed from catalog
  for(const o of open){ const L=(linesById[o.id]||{}).items||[]; let over=[], price=[];
    for(const l of L){ if(l.parent||!l.pid||[5,7].includes(l.t)) continue; const p=cat.get(l.pid); if(!p) continue; const d=+l.disc||0;
      if(d>0&&!p.discountable) over.push({code:l.code,disc:d,rule:"no discount"}); else if(d>0&&p.maxDisc>0&&d>p.maxDisc) over.push({code:l.code,disc:d,rule:"max "+p.maxDisc+"%"});
      if(!l.foc&&!l.sb&&p.price>0&&Math.abs((+l.list||0)-p.price)>0.5) price.push({code:l.code,list:+l.list||0,catalog:p.price}); }
    if(over.length) add("discount","high",o,"",{lines:over});
    if(price.length) add("price","low",o,"",{lines:price}); }
  // 9 crew booked on two jobs the same day
  const crewDay={};
  for(const o of open){ if(!BLOCKING.includes(o.status)) continue; for(const l of ((linesById[o.id]||{}).items||[])){ if(!l.crewId||![5,7].includes(l.t)) continue; let s=l.start||o.useStart||o.ship, e=l.end||o.useEnd||o.ret; if(!s||!e) continue; if(e<today) continue; if(s<today) s=today;
    eachDay(s,e>horizon?horizon:e,d=>{ const k=l.crewId+"|"+d; const c=(crewDay[k]=crewDay[k]||{name:l.desc,nos:new Set()}); c.nos.add(o.no); }); } }
  const crewHits={}; for(const [k,v] of Object.entries(crewDay)){ if(v.nos.size<2) continue; const [cid,d]=k.split("|"); const key=cid+"|"+[...v.nos].sort().join(","); const h=(crewHits[key]=crewHits[key]||{crewId:cid,name:v.name,nos:[...v.nos].sort(),from:d,to:d}); if(d<h.from) h.from=d; if(d>h.to) h.to=d; }
  for(const h of Object.values(crewHits)) add("crew","high",null,"",h);
  // ---------- money ----------
  const M={quotes:{n:0,value:0},confirmed:{n:0,value:0},onRent:{n:0,value:0},toBill:{n:0,value:0},weeks:{},bySale:{},byCustomer:{}};
  const weekOf=s=>{ const t=pD(s); const dow=(new Date(t).getUTCDay()+6)%7; return new Date(t-dow*864e5).toISOString().slice(0,10); };
  for(const o of open){ const v=netOf(o);
    if(o.status==="Quote"){ if(o.ship&&o.ship>=today){ M.quotes.n++; M.quotes.value+=v; } continue; }
    if(o.status==="Order"||o.status==="Approve"){ M.confirmed.n++; M.confirmed.value+=v; if(o.ship&&o.ship>=today){ const w=weekOf(o.ship); M.weeks[w]=(M.weeks[w]||0)+v; } }
    if(o.status==="Shipped"){ M.onRent.n++; M.onRent.value+=v; }
    if(o.status==="Returned"){ M.toBill.n++; M.toBill.value+=v; }
    const sk=o.sale||"—"; const s=(M.bySale[sk]=M.bySale[sk]||{jobs:0,list:0,disc:0,net:0}); s.jobs++; s.list+=(+(o.totals||{}).list||0); s.disc+=(+(o.totals||{}).disc||0)+(+(o.totals||{}).extra||0)-(+(o.totals||{}).adj||0); s.net+=v;
    const ck=o.customerName||"—"; const c=(M.byCustomer[ck]=M.byCustomer[ck]||{jobs:0,net:0}); c.jobs++; c.net+=v; }
  for(const k of ["quotes","confirmed","onRent","toBill"]) M[k].value=r2(M[k].value);
  // ---------- assets ----------
  const earn={}, sub={}, used=new Set();
  for(const o of open){ if(o.status==="Quote") continue; for(const l of ((linesById[o.id]||{}).items||[])){ if(!l.pid) continue; const c=lineCalc(l);
      if(STOCKED_TYPES.includes(l.t)){ used.add(l.pid); if(!l.parent){ const e=(earn[l.pid]=earn[l.pid]||{code:l.code,desc:l.desc,net:0,jobs:new Set()}); e.net+=c.total; e.jobs.add(o.no); } }
      if(l.t===6&&!l.parent){ const s=(sub[l.code]=sub[l.code]||{code:l.code,desc:l.desc,net:0,jobs:new Set()}); s.net+=c.total; s.jobs.add(o.no); } } }
  const fix=a=>a.map(x=>({...x,net:r2(x.net),jobs:x.jobs.size})).sort((a,b)=>b.net-a.net);
  const idle=[...cat.values()].filter(p=>p.type===1&&(+p.stock||0)>0&&!used.has(p.id)&&p.price>0).sort((a,b)=>b.price-a.price);
  return {problems:P,money:M,assets:{top:fix(Object.values(earn)).slice(0,15),subrent:fix(Object.values(sub)).slice(0,15),idleCount:idle.length,idleTop:idle.slice(0,15).map(p=>({code:p.code,desc:p.desc,stock:p.stock,price:p.price}))}};
}

/* ================= writes ================= */
const Q={};
function enqueue(path,fn){const p=(Q[path]||Promise.resolve()).then(()=>attempt(fn));Q[path]=p.catch(()=>{});return p;}
async function attempt(fn){try{return await fn();}catch(e){ if(e&&(e.code==="unavailable"||e.code==="resource_exhausted")){await sleep(e.code==="unavailable"?400+Math.random()*600:1500);try{return await fn();}catch(e2){fail(e2);}} else fail(e);} }
function fail(e){const c=e&&e.code; toast(t(c==="invalid_argument"||c==="not_granted"?"errPerm":c==="quota_exceeded"?"errQuota":c==="resource_exhausted"?"errBusy":"errGeneric")); throw e;}
const put=(path,data)=>enqueue(path,()=>S.db.doc(path).set(data));
const upd=(path,patch)=>enqueue(path,()=>S.db.doc(path).update(patch));
const del=path=>enqueue(path,()=>S.db.doc(path).delete());
function logged(o,a,extra){const log=(o.log?clone(o.log):[]).slice(-79);log.push({at:nowISO(),by:S.me?.id||null,a,...(extra||{})});return log;}

/* ================= derived ================= */
function rebuildCat(){ S.cat=new Map(S.catBase); for(const [id,e] of S.catEdits){ if(e.deleted){S.cat.delete(id);continue;} S.cat.set(id,{...(S.catBase.get(id)||{}),...e,id,edited:true}); } }
function rebuildCust(){ S.cust=new Map(S.custBase); for(const [id,e] of S.custEdits){ S.cust.set(id,{...(S.custBase.get(id)||{}),...e,id,edited:true}); } }
function ordersArr(){return [...S.orders.values()];}
function stockOf(pid){const p=S.cat.get(pid);return p?Math.max(0,+p.stock||0):0;}
function lineIssues(o,lines){ if(!o.ship||!o.ret||["Shipped","Returned","Draft INV","Cancel"].includes(o.status)) return []; const need={}; for(const l of lines){ if(!STOCKED_TYPES.includes(l.t)||!l.pid) continue; need[l.pid]=(need[l.pid]||0)+(+l.qty||0); }
  const out=[]; const all=ordersArr(); for(const pid in need){ const free=stockOf(+pid)-bookedQty(+pid,o.ship,o.ret,all,o.id,today()); if(need[pid]>free) out.push({pid:+pid,short:need[pid]-Math.max(0,free)}); } return out; }
function holds(pid,o){ const r=[]; for(const x of S.orders.values()){ if(x.id===o.id||x.status!=="Quote"||!x.ship||!x.ret||!(x.ship<=o.ret&&x.ret>=o.ship)) continue; if((x.usage||[]).some(([p])=>p===pid)) r.push(x.no);} return r; }

let profBusy=false;
async function refreshProfiles(){ if(!S.user||profBusy) return; const ids=new Set(S.team.keys()); for(const o of S.orders.values()) (o.log||[]).forEach(l=>l.by&&ids.add(l.by)); if(S.me?.id) ids.add(S.me.id); const need=[...ids]; if(!need.length) return; profBusy=true; try{const ps=await S.user.profiles(need); let ch=false; for(const id of need) if(S.prof[id]?.name!==ps[id]?.name) ch=true; S.prof={...S.prof,...ps}; if(ch) scheduleRender();}finally{profBusy=false;} }

let raf=0,sheetPending=false,pDown=false,renderWaiting=false;
/* Never redraw between a press and its click, or the click lands on a node that was just replaced. */
document.addEventListener("pointerdown",()=>{pDown=true;},true);
const release=()=>setTimeout(()=>{ pDown=false; if(renderWaiting){renderWaiting=false;scheduleRender();} },0);
document.addEventListener("click",release,true); document.addEventListener("pointercancel",release,true);
document.addEventListener("pointerup",()=>setTimeout(()=>{ if(pDown) release(); },350),true);
function scheduleRender(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0; if(pDown){renderWaiting=true;return;} render();}); }
/* Uncommitted text: the field holds something not yet saved (value differs from what was rendered). */
function typing(el){const a=document.activeElement; if(!a||!el.contains(a)) return false; if(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!["checkbox","radio","button","date","number"].includes(a.type))) return a.value!==a.defaultValue||a.type==="search"; return false;}
function focusKey(a){ if(!a||a===document.body) return null; if(a.id) return "#"+CSS.escape(a.id); for(const k of ["lk","sk"]) if(a.dataset[k]) return `[data-${k}="${CSS.escape(a.dataset[k])}"][data-${k==="lk"?"lf":"sf"}="${CSS.escape(a.dataset[k==="lk"?"lf":"sf"])}"]`; return null; }
function withFocus(root,fn){ const a=document.activeElement; const key=root.contains(a)?focusKey(a):null; let sel=null; try{ if(key&&a.selectionStart!=null) sel=[a.selectionStart,a.selectionEnd]; }catch(e){} fn(); if(key){ const b=root.querySelector(key); if(b&&b!==document.activeElement){ b.focus({preventScroll:true}); try{ if(sel&&b.setSelectionRange) b.setSelectionRange(sel[0],sel[1]); }catch(e){} } } }
function render(){ renderChrome(); if(typing($("#main"))) renderBodyOnly(); else withFocus($("#main"),renderMain); if(S.sheet){ if(typing($("#sheet"))) sheetPending=true; else renderSheet(); } }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(sheetPending&&!typing($("#sheet"))){sheetPending=false;scheduleRender();} },0));

function jobMatch(o){ const q=S.jq.trim().toLowerCase(); if(!q) return true; return [o.no,o.jobTitle,o.customerName,o.dop].some(v=>String(v||"").toLowerCase().includes(q)); }
function bodyJobs(){ if(!S.db) return S.offline?"":loading(); if(!S.loaded.orders) return loading();
  const all=ordersArr(); const cnt={}; for(const o of all) cnt[o.status]=(cnt[o.status]||0)+1;
  let h=`<div class="stats">${["Quote","Order","Approve","Shipped","Returned"].map(s=>`<button type="button" class="stat ${stCls(s)}" data-act="jf" data-f="${s}" aria-pressed="${S.jf===s}"><b>${cnt[s]||0}</b><span>${esc(s)}</span></button>`).join("")}<button type="button" class="stat" data-act="jf" data-f="open" aria-pressed="${S.jf==="open"}"><b>${all.length}</b><span>${esc(t("openOnly"))}</span></button></div>`;
  h+=`<div class="row"><button class="chip" type="button" data-act="showClosed" aria-pressed="${S.showClosed}">${esc(t("closedLoad"))}</button>${S.showClosed?["Draft INV","Cancel"].map(s=>`<button class="chip" type="button" data-act="jf" data-f="${s}" aria-pressed="${S.jf===s}"><span class="dot ${stCls(s)}" style="background:var(--tc)"></span>${esc(s)}<span class="n">${[...S.closed.values()].filter(o=>o.status===s).length}</span></button>`).join(""):`<span class="muted small">${esc(t("closedNote"))}</span>`}</div>`;
  const src=["Draft INV","Cancel"].includes(S.jf)?[...S.closed.values()]:all;
  const list=src.filter(o=>S.jf==="open"||["Draft INV","Cancel"].includes(S.jf)?(S.jf==="open"||o.status===S.jf):o.status===S.jf).filter(jobMatch).sort((a,b)=>String(b.no).localeCompare(String(a.no)));

let linesUnsub=null, lockTimer=null;
async function openOrder(id){ closeSheet(); S.sheet="order"; S.openId=id; S.lines=null; S.ttab=1; S.iq=""; S.confirm=null; S.lock={mine:false,until:null};
  $("#sheetWrap").hidden=false; $("#sheet").className="sheet"; document.body.style.overflow="hidden"; renderSheet();
  linesUnsub=S.db.doc("lines/"+id).onSnapshot(snap=>{ if(S.openId!==id) return; const d=snap.exists?snap.data():{items:[]}; if(!S.lock.mine||!S.lines) S.lines=clone(d.items||[]); S.linesVer++; scheduleRender(); },()=>{});
}
function closeSheet(){ if(linesUnsub){linesUnsub();linesUnsub=null;} if(lockTimer){clearInterval(lockTimer);lockTimer=null;} if(S.lock.mine&&S.openId&&S.db&&S.me?.id){ S.db.doc("locks/"+S.openId).acquire({holder:S.me.id,ttlMs:1000}).catch(()=>{}); } S.sheet=null;S.openId=null;S.lines=null;S.lock={mine:false,until:null}; $("#sheetWrap").hidden=true; document.body.style.overflow=""; }
async function takeLock(){ if(!S.openId||!S.me?.id) return false; try{ const r=await S.db.doc("locks/"+S.openId).acquire({holder:S.me.id,ttlMs:90000}); if(r.acquired){ S.lock={mine:true,until:null}; if(!lockTimer) lockTimer=setInterval(()=>{ if(S.openId) S.db.doc("locks/"+S.openId).acquire({holder:S.me.id,ttlMs:90000}).catch(()=>{}); },45000); return true; } S.lock={mine:false,until:r.expiresAt||null}; return false; }catch(e){ S.lock={mine:false,until:null}; return false; } }

  for(const l of rows){ const c=lineCalc(l); const child=!!l.parent; const sh=!child&&short[l.pid];
    const numAny=(f,v,step)=>`<input class="inp cell" type="number" min="0" step="${step||1}" data-lk="${esc(l.k)}" data-lf="${f}" value="${esc(v)}">`; const num=(f,v,step)=>can&&!child?`<input class="inp cell" type="number" min="0" step="${step||1}" data-lk="${esc(l.k)}" data-lf="${f}" value="${esc(v)}">`:`<span class="num">${esc(v===""||v==null?"-":v)}</span>`;
    const hold=(!child&&STOCKED_TYPES.includes(l.t)&&!["Shipped","Returned","Draft INV","Cancel"].includes(o.status))?holds(l.pid,o):[];
    h+=`<tr class="${child?"child":""} ${sh?"bad":""}"><td class="mono">${esc(l.code)}</td><td style="min-width:200px">${esc(l.desc)}${sh?`<div class="bad small">${esc(t("shortBy",{n:sh}))}</div>`:""}${hold.length?`<div class="warn small">${esc(t("onHold",{c:hold.join(", ")}))}</div>`:""}${l.remark?`<div class="muted small">${esc(l.remark)}</div>`:""}</td>

    ${can?`<td>${child?"":`<button class="btn sm ghost" type="button" data-act="rmLine" data-k="${esc(l.k)}">${esc(t("remove"))}</button>`}</td>`:""}</tr>`; }
  h+=`</tbody></table></div>`;

function addItemBox(o){ const q=S.iq.trim().toLowerCase(); const tt=S.ttab;
  let h=`<div class="field"><span>${esc(t("addItem"))} · ${esc(typeLabel(tt))}</span><input class="inp" id="iq" type="search" placeholder="${esc(t("searchItems"))}" value="${esc(S.iq)}" autocomplete="off"></div>${o.dept&&o.dept!==3?`<label class="row small"><input type="checkbox" id="idept" ${S.idept?"checked":""}> ${esc(t("onlyDept"))} (${esc(deptName(o.dept))})</label>`:""}<div id="iresults">${itemResults(o)}</div>`;

function itemResults(o){ const q=S.iq.trim().toLowerCase(); if(q.length<1) return ""; const tt=S.ttab;
  if(tt===5||tt===7){ const res=[]; for(const c of S.crew){ for(const p of c.pos||[]){ if(p.enable===false) continue; const name=[c.first,c.last].filter(Boolean).join(" ")||c.nick||p.name; if(![name,c.code,p.name,p.code].some(v=>String(v||"").toLowerCase().includes(q))) continue; if(S.idept&&o.dept&&o.dept!==3&&p.dept&&p.dept!==deptName(o.dept)) continue; res.push({c,p,name}); if(res.length>=40) break;} if(res.length>=40) break; }
    if(!res.length) return `<p class="muted small">${esc(t("noMatch"))}</p>`;
    return `<div class="results">${res.map(({c,p,name})=>`<div class="res"><div style="min-width:0"><div>${esc(p.name)} <span class="muted">· ${esc(name)}</span></div><div class="muted small mono">${esc(p.code)} · ${money(p.price)} · OT ${money(p.priceOt)}</div></div><button class="btn sm" type="button" data-act="addCrew" data-cid="${esc(c.id)}" data-pc="${esc(p.code)}">${esc(t("add"))}</button></div>`).join("")}</div>`; }
  const list=[]; for(const p of S.cat.values()){ if(p.type!==tt) continue; if(S.idept&&o.dept&&o.dept!==3&&p.dept!==o.dept) continue; if(!(String(p.code).toLowerCase().includes(q)||String(p.desc).toLowerCase().includes(q))) continue; list.push(p); if(list.length>=40) break; }

function docBody(o,lines,kind,disc){ const G=orderTotals(lines,o); const title=kind==="quote"?"QUOTATION / ใบเสนอราคา":kind==="draft"?"DRAFT INVOICE":"ITEM LIST";
  const c=S.cfg.company||{}; const rem=(S.cfg.remarks||[]).find(r=>String(r.id)===String(o.remarkId)); const ft=(S.cfg.footers||[]).find(r=>String(r.id)===String(o.footerId));
  const th='style="text-align:left;border-bottom:1px solid #999;padding:4px 6px;font-size:11px"', td='style="padding:3px 6px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top"', tdr='style="padding:3px 6px;border-bottom:1px solid #eee;font-size:12px;text-align:right;white-space:nowrap"';
  let h=`<div style="font-family:'IBM Plex Sans Thai',Arial,sans-serif;color:#111;min-width:640px"><div style="display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #111;padding-bottom:8px"><div><div style="font-size:20px;font-weight:700;letter-spacing:.06em">${esc(c.name||"Lighthouse Film Service")}</div><div style="font-size:11px;white-space:pre-wrap">${esc(c.addr||"")}</div>${c.tax?`<div style="font-size:11px">Tax ID ${esc(c.tax)}</div>`:""}</div><div style="text-align:right"><div style="font-size:16px;font-weight:700">${esc(title)}</div><div style="font-size:12px">No. ${esc(o.no)} · Rev ${esc(String(o.rev||0).padStart(3,"0"))}</div><div style="font-size:12px">Date ${esc(fmtD(today()))}</div></div></div>
  <table style="width:100%;margin:10px 0;font-size:12px;border-collapse:collapse"><tr><td style="width:50%;vertical-align:top"><b>${esc(o.customerName)}</b><br>${esc(o.billing||"")}<br>${o.phone?"Tel "+esc(o.phone):""}${o.contact?`<br>Attn: ${esc(o.contact)} ${esc(o.contactPhone||"")}`:""}</td><td style="vertical-align:top">Job: <b>${esc(o.jobTitle)}</b><br>Job type: ${esc(o.jobType||"")} · ${esc(deptName(o.dept))}<br>Ship ${esc(fmtD(o.ship))} · Return ${esc(fmtD(o.ret))}<br>Usage ${esc(fmtD(o.useStart))} – ${esc(fmtD(o.useEnd))}<br>DOP ${esc(o.dop||"")} · Sales ${esc(o.sale||"")}</td></tr></table>`;
  for(const ty of TYPES){ const rows=lines.filter(l=>l.t===ty.id); if(!rows.length) continue; const T=typeTotals(lines,ty.id);
    h+=`<div style="font-weight:700;margin-top:10px;font-size:13px">${esc(ty.k)}</div><table style="width:100%;border-collapse:collapse"><thead><tr><th ${th}>Code</th><th ${th}>Description</th>${kind==="items"?`<th ${th}>Qty</th>`:`<th ${th}>Price</th><th ${th}>Qty</th><th ${th}>Days</th>${disc?`<th ${th}>Amount</th><th ${th}>Disc%</th>`:""}<th ${th}>Total</th>`}</tr></thead><tbody>`;
    for(const l of rows){ const k=lineCalc(l); const child=!!l.parent;
      const free=child&&!k.amount;
      h+=kind==="items"?`<tr><td ${td}>${esc(l.code)}</td><td ${td}>${child?"&nbsp;&nbsp;– ":""}${esc(l.desc)}</td><td ${tdr}>${+l.qty||0}</td></tr>`
      :`<tr><td ${td}>${esc(l.code)}</td><td ${td}>${child?"&nbsp;&nbsp;– ":""}${esc(l.desc)}${l.foc?" (FOC)":""}${l.sb?" (Standby)":""}</td><td ${tdr}>${free?"-":money(l.list)}</td><td ${tdr}>${+l.qty||0}</td><td ${tdr}>${+l.days||0}</td>${disc?`<td ${tdr}>${free?"-":money(k.amount)}</td><td ${tdr}>${free||!+l.disc?"-":money(l.disc)}</td>`:""}<td ${tdr}>${free?"-":money(disc?k.total:k.amount)}</td></tr>`; }
    if(kind!=="items") h+=`<tr><td colspan="${disc?7:5}" ${tdr}>${disc?`List ${money(T.list)} · Discount ${money(T.disc)} · `:""}<b>Sub total ${money(disc?T.sub:T.list)}</b></td></tr>`;
    h+=`</tbody></table>`; }
  if(kind!=="items"){ const sub=disc?G.sub:G.list; const extra=disc?G.extra:0; const base=sub-extra+(disc?G.adj:0)+G.ins; const vat=o.tax==="Not Vat"?0:Math.round(base*7)/100; const tot=Math.round((base+vat)*100)/100;
    const showSame=disc; // with discount: exact totals; without: list-price view as in the old "Not Discount" print
    h+=`<table style="margin-left:auto;margin-top:10px;font-size:12px;border-collapse:collapse;min-width:280px">${disc?`<tr><td ${td}>List</td><td ${tdr}>${money(G.list)}</td></tr><tr><td ${td}>Discount</td><td ${tdr}>${money(G.disc)}</td></tr>`:""}<tr><td ${td}>Sub total</td><td ${tdr}>${money(sub)}</td></tr>${extra?`<tr><td ${td}>Extra discount</td><td ${tdr}>-${money(extra)}</td></tr>`:""}${disc&&G.adj?`<tr><td ${td}>Adjustment</td><td ${tdr}>${money(G.adj)}</td></tr>`:""}${G.ins?`<tr><td ${td}>Insurance fee</td><td ${tdr}>${money(G.ins)}</td></tr>`:""}<tr><td ${td}>VAT 7%</td><td ${tdr}>${money(showSame?G.vat:vat)}</td></tr><tr><td ${td}><b>Total</b></td><td ${tdr}><b>${money(showSame?G.total:tot)}</b></td></tr></table>`;
    if(rem) h+=`<div style="margin-top:14px;font-size:11px;border-top:1px solid #ccc;padding-top:6px">${sanitizeHtml(rem.html)}</div>`;
    if(ft) h+=`<div style="margin-top:6px;font-size:11px">${sanitizeHtml(ft.html)}</div>`;
    h+=`<div style="display:flex;justify-content:space-between;gap:30px;margin-top:40px;font-size:12px"><div style="flex:1;border-top:1px solid #111;text-align:center;padding-top:4px">Customer</div><div style="flex:1;border-top:1px solid #111;text-align:center;padding-top:4px">${esc(c.name||"Lighthouse Film Service")}</div></div>`; }
  return h+`</div>`; }
/* Templates came from the old system as HTML. Keep only basic text tags. */
function sanitizeHtml(html){ const d=document.createElement("div"); d.innerHTML=String(html||""); const ok=new Set(["P","BR","B","STRONG","I","EM","U","UL","OL","LI","SPAN","DIV"]); const walk=n=>{ for(const c of [...n.childNodes]){ if(c.nodeType===1){ if(!ok.has(c.tagName)){ c.replaceWith(document.createTextNode(c.textContent)); continue; } for(const a of [...c.attributes]) c.removeAttribute(a.name); walk(c);} else if(c.nodeType!==3) c.remove(); } }; walk(d); return d.innerHTML; }

/* Thai national ID: 13 digits, last digit is a mod-11 checksum. */
function thaiIdOk(s){ s=String(s||"").replace(/\D/g,""); if(s.length!==13) return false; let sum=0; for(let i=0;i<12;i++) sum+=(+s[i])*(13-i); return ((11-sum%11)%10)===+s[12]; }
const digits=s=>String(s||"").replace(/\D/g,"");
function fmtId(s){ const d=digits(s); return d.length===13?`${d[0]}-${d.slice(1,5)}-${d.slice(5,10)}-${d.slice(10,12)}-${d[12]}`:d; }
function maskId(s){ const d=digits(s); return d.length>=4?`x-xxxx-xxxxx-${d.slice(-3,-1)}-${d.slice(-1)}`:"x"; }
function crewName(c){ return [c.first,c.last].filter(Boolean).join(" ")||c.nick||""; }
function parseIds(txt){ const byCode=new Map(), byId=new Map(), byName=new Map(); for(const c of S.crew){ if(c.code) byCode.set(String(c.code).trim().toLowerCase(),c); byId.set(String(c.id),c); const n=crewName(c).replace(/\s+/g," ").trim().toLowerCase(); if(n) byName.set(n,c); }
  const out=[]; for(const raw of String(txt).split(/\r?\n/)){ const line=raw.trim(); if(!line) continue; const cols=(line.includes("\t")?line.split("\t"):line.split(",")).map(x=>x.trim()); if(cols.length<2) { out.push({raw:line,ok:false,why:"cols"}); continue; }
    const key=cols[0], id=digits(cols[cols.length-1]); if(/^(code|รหัส|crew|name|ชื่อ)/i.test(key)&&!id) continue;
    const c=byCode.get(key.toLowerCase())||byId.get(key)||byName.get(key.replace(/\s+/g," ").toLowerCase()); out.push({key,c,id,valid:thaiIdOk(id),ok:!!c&&thaiIdOk(id),why:!c?"nomatch":!thaiIdOk(id)?"checksum":""}); }
  return out; }

  <button class="btn primary" type="button" data-act="idsSave" ${good.length?"":"disabled"}>${esc(t("idsSave",{n:good.length}))}</button><p class="muted small" style="margin:0">${esc(t("idsPrivacy"))}</p></section>`; }

function bodySet(){ const c=S.cfg.company||{}; return `<form class="sec" id="setForm"><div class="grid"><label class="field span2"><span>${esc(t("company"))}</span><input class="inp" id="s-name" value="${esc(c.name||"Lighthouse Film Service")}"></label><label class="field"><span>${esc(t("companyTax"))}</span><input class="inp" id="s-tax" value="${esc(c.tax||"")}"></label><label class="field spanall"><span>${esc(t("companyAddr"))}</span><textarea class="inp" id="s-addr">${esc(c.addr||"")}</textarea></label></div><div class="row"><button class="btn primary" type="submit">${esc(t("save"))}</button></div></form>
  <section class="sec"><h3>${esc(t("remarks"))}<small>${(S.cfg.remarks||[]).length}</small></h3>${(S.cfg.remarks||[]).map(r=>`<details><summary>${esc(r.name)}${r.def?" ★":""}</summary><div class="small" style="padding:6px 0">${sanitizeHtml(r.html)}</div></details>`).join("")}</section>
  <section class="sec"><h3>${esc(t("footers"))}<small>${(S.cfg.footers||[]).length}</small></h3>${(S.cfg.footers||[]).map(r=>`<div>${esc(r.name)}${r.def?" ★":""}</div>`).join("")}</section>`; }
function sheetRepair(){ return ""; }

/* ================= actions ================= */
async function nextOrderNo(){ const ref=S.db.doc("counters/orders"); const be2=(new Date().getFullYear()+543)%100;
  for(let i=0;i<6;i++){ const r=await ref.acquire({holder:S.me?.id||uid(),ttlMs:5000}); if(r.acquired){ const snap=await ref.get(); const d=snap.exists?snap.data():{}; let seq=(+d.be===be2?+d.seq||0:0)+1; await ref.set({be:be2,seq}); return orderNo(be2,seq); } await sleep(700+Math.random()*600); }
  throw {code:"resource_exhausted"}; }
function readHeader(prefix){ const g=k=>{const el=$("#"+prefix+k);return el?el.value:"";}; const o={}; for(const k of ["dop","rentType","dpw","customerName","jobTitle","jobType","dept","billing","phone","fax","ship","ret","useStart","useEnd","contact","contactPhone","sale","tax","footerId","remarkId","pm","gaffer","keyGrip","note"]) o[k]=g(k);
  o.dept=o.dept?+o.dept:""; o.dpw=+o.dpw||0; return o; }
function applyCustomer(o){ const c=[...S.cust.values()].find(x=>x.name===o.customerName); if(c){ o.customerId=c.id; if(!o.billing) o.billing=c.addr||""; if(!o.phone) o.phone=c.phone||""; } return o; }
async function createOrder(){ const o=applyCustomer(readHeader("h-")); if(!o.customerName.trim()){toast(t("needCust"));return;} if(!o.jobTitle.trim()){toast(t("needTitle"));return;} if(o.ship&&o.ret&&o.ret<o.ship){toast(t("badDates"));return;}
  const no=await nextOrderNo(); const id=no; const ts=nowISO();
  const data={...o,id,no,status:"Quote",rev:0,extraDisc:0,insurance:0,totals:orderTotals([],o),usage:[],createdAt:ts,createdBy:S.me?.id||null,updatedAt:ts,log:[{at:ts,by:S.me?.id||null,a:"created"}]};
  await put("lines/"+id,{items:[],updatedAt:ts}); await put("orders/"+id,data); await openOrder(id); if(canEditLines(role(),"Quote")) { await takeLock(); renderSheet(); } }
async function copyOrder(o){ const no=await nextOrderNo(); const ts=nowISO(); const items=clone(S.lines||[]).map(l=>({...l,out:0,in:0,dmg:0,lost:0,repaired:false}));
  const keep={...clone(o)}; for(const k of ["legacyId","log","createdByName"]) delete keep[k];
  const data={...keep,id:no,no,status:"Quote",rev:0,createdAt:ts,createdBy:S.me?.id||null,updatedAt:ts,jobTitle:o.jobTitle,log:[{at:ts,by:S.me?.id||null,a:"created"}],totals:orderTotals(items,o),usage:usageOf(items)};
  await put("lines/"+no,{items,updatedAt:ts}); await put("orders/"+no,data); toast(t("copied")); await openOrder(no); }
async function move(o,to){ if(to==="Cancel"&&S.confirm!=="cancel"){S.confirm="cancel";renderSheet();return;} S.confirm=null;
  const why=moveCheck(role(),o,to,S.lines||[],lineIssues(o,S.lines||[])); if(why){toast(t(why));return;}
  const patch={status:to,updatedAt:nowISO(),log:logged(o,"status",{to})}; if(to==="Cancel"||to==="Draft INV"){ /* closed jobs stop holding stock */ }
  await upd("orders/"+o.id,patch); }
async function saveStore(o,mut,act){ if(!S.lines) return; if(!S.lock.mine&&!(await takeLock())){ toast(t("lockedBy",{t:S.lock.until?new Date(S.lock.until).toLocaleTimeString():"—"})); renderSheet(); return; } mut(S.lines); scheduleRender(); const items=clone(S.lines); await put("lines/"+o.id,{items,updatedAt:nowISO()}); await upd("orders/"+o.id,{updatedAt:nowISO(),log:logged(o,act)}); }

document.addEventListener("click",async e=>{ const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act; const o=S.openId&&(S.orders.get(S.openId)||S.closed.get(S.openId));
  if(!["move","teamRemove"].includes(a)) S.confirm=null;
  try{ switch(a){
  case"tab": S.tabChosen=true; S.tab=el.dataset.tab; S.headKey=""; render(); window.scrollTo(0,0); break;
  case"lang": LANG=LANG==="th"?"en":"th"; try{localStorage.setItem("lhd-lang",LANG);}catch(_){} S.headKey=""; render(); break;
  case"jf": S.jf=el.dataset.f; renderBodyOnly(); break;
  case"showClosed": S.showClosed=!S.showClosed; if(S.showClosed) loadClosed(); renderBodyOnly(); break;
  case"newOrder": closeSheet(); S.sheet="neworder"; $("#sheetWrap").hidden=false; $("#sheet").className="sheet"; document.body.style.overflow="hidden"; renderSheet(); break;
  case"openOrder": { await openOrder(el.dataset.id); const st=(S.orders.get(el.dataset.id)||{}).status; if(canEditLines(role(),st)||(isR("admin","store")&&["Approve","Shipped"].includes(st))){ await takeLock(); renderSheet(); } break; }
  case"close": closeSheet(); break;
  case"ttab": S.ttab=+el.dataset.t; S.iq=""; renderSheet(); break;
  case"addLine": if(o&&S.lines&&S.lock.mine){ const p=S.cat.get(+el.dataset.pid); if(!p) break; const l=newLineFromProduct(o,p); S.lines.push(l); if(p.kit&&p.kit.length) S.lines.push(...expandKit(l,p.kit,S.cat,uid)); linesChanged(); } break;
  case"addCrew": if(o&&S.lines&&S.lock.mine){ const c=S.crew.find(x=>String(x.id)===el.dataset.cid); const p=c&&(c.pos||[]).find(x=>x.code===el.dataset.pc); if(!p) break; const start=o.useStart||o.ship,end=o.useEnd||o.ret; const nm=[c.first,c.last].filter(Boolean).join(" ")||c.nick;
      S.lines.push({k:uid(),t:S.ttab===7?7:5,pid:null,crewId:c.id,code:p.code,desc:p.name+(nm?" · "+nm:""),list:+p.price||0,otRate:+p.priceOt||0,ot:0,qty:1,days:chargeDays(start,end,o.rentType,o.dpw)||1,disc:0,foc:false,sb:false,start,end,parent:null,remark:""}); linesChanged(); } break;
  case"rmLine": if(S.lock.mine){ const k=el.dataset.k; S.lines=S.lines.filter(l=>l.k!==k&&l.parent!==k); linesChanged(); } break;
  case"flag": if(S.lock.mine){ const l=S.lines.find(x=>x.k===el.dataset.k); if(l){ l[el.dataset.f]=!l[el.dataset.f]; if(l.foc&&l.sb){ if(el.dataset.f==="foc") l.sb=false; else l.foc=false; } linesChanged(); } } break;
  case"move": if(o) await move(o,el.dataset.s); break;
  case"copyOrder": if(o) await copyOrder(o); break;
  case"allOut": if(o) await saveStore(o,L=>L.forEach(l=>{ if(STOCKED_TYPES.includes(l.t)) l.out=+l.qty||0; }),"out"); break;
  case"allIn": if(o) await saveStore(o,L=>L.forEach(l=>{ if(STOCKED_TYPES.includes(l.t)){ l.in=+l.out||0; l.dmg=0; l.lost=0; } }),"in"); break;
  case"sendRepair": if(o&&S.lines){ for(const l of S.lines.filter(l=>(+l.dmg||0)>0&&!l.repaired)){ const id=uid(); await put("repairs/"+id,{id,pid:l.pid,code:l.code,desc:l.desc,qty:+l.dmg,status:"Waiting",orderNo:o.no,note:"",at:nowISO(),by:S.me?.id||null}); l.repaired=true; } await saveStore(o,()=>{},"in"); toast(t("sentRepair")); } break;
  case"docKind": S.docKind=el.dataset.k; renderSheet(); break;
  case"docDisc": S.docDisc=el.dataset.v==="1"; renderSheet(); break;
  case"download": if(o) await downloadDoc(o); break;
  case"cmore": S.climit+=200; renderBodyOnly(); break;
  case"kRefresh": await loadCockpit(true); break;
  case"idsOpen": S.idRows=null; S.sheet="ids"; S.openId=null; $("#sheetWrap").hidden=false; $("#sheet").className="sheet narrow"; document.body.style.overflow="hidden"; renderSheet(); break;
  case"idsSave": { const good=(S.idRows||[]).filter(r=>r.ok); if(!good.length) break; const merged={...S.ids}; for(const r of good) merged[r.c.id]=r.id; await put("secure/crewIds",{ids:merged,updatedAt:nowISO(),updatedBy:S.me?.id||null}); toast(t("idsSaved",{n:good.length})); closeSheet(); break; }
  case"reveal": { const k=String(el.dataset.id); if(S.reveal.has(k)) S.reveal.delete(k); else S.reveal.add(k); renderBodyOnly(); break; }
  case"crewIds": if(o) await downloadCrewIds(o); break;
  case"kSec": K.sec=el.dataset.k; S.headKey=""; renderMain(); break;
  case"kFilter": K.filter=el.dataset.k; renderBodyOnly(); break;
  case"kmore": S.klimit+=200; renderBodyOnly(); break;
  case"newItem": kitDraft=[]; S.kq=""; S.openId=null; S.sheet="item"; $("#sheetWrap").hidden=false; $("#sheet").className="sheet narrow"; document.body.style.overflow="hidden"; renderSheet(); break;
  case"openItem": { const p=S.cat.get(+el.dataset.id); kitDraft=clone(p?.kit||[]); S.kq=""; S.openId=el.dataset.id; S.sheet="item"; $("#sheetWrap").hidden=false; $("#sheet").className="sheet narrow"; document.body.style.overflow="hidden"; renderSheet(); break; }
  case"addPart": { const pid=+el.dataset.pid; kitDraft=kitDraft||[]; if(!kitDraft.some(k=>k[0]===pid)) kitDraft.push([pid,1]); const p=S.openId?S.cat.get(+S.openId):null; if(p) p.kit=kitDraft; S.kq=""; renderSheet(); break; }
  case"rmPart": { kitDraft.splice(+el.dataset.i,1); const p=S.openId?S.cat.get(+S.openId):null; if(p) p.kit=kitDraft; renderSheet(); break; }
  case"newCust": S.openId=null; S.sheet="cust"; $("#sheetWrap").hidden=false; $("#sheet").className="sheet narrow"; document.body.style.overflow="hidden"; renderSheet(); break;
  case"openCust": S.openId=+el.dataset.id||el.dataset.id; S.sheet="cust"; $("#sheetWrap").hidden=false; $("#sheet").className="sheet narrow"; document.body.style.overflow="hidden"; renderSheet(); break;
  case"teamAdd": await put("team/"+el.dataset.uid,{role:"sale",addedAt:nowISO(),addedBy:S.me?.id||null}); $("#teamHits").innerHTML=""; const q=$("#teamQ"); if(q) q.value=""; break;
  case"teamRemove": { const k="tm:"+el.dataset.uid; if(S.confirm!==k){S.confirm=k;renderBodyOnly();break;} S.confirm=null; await del("team/"+el.dataset.uid); break; }
  } }catch(err){} });

document.addEventListener("input",e=>{ const el=e.target;
  if(el.id==="jq"){S.jq=el.value;renderBodyOnly();}
  else if(el.id==="cq"){S.cq=el.value;S.climit=100;renderBodyOnly();}
  else if(el.id==="kq2"){S.kq2=el.value;S.klimit=100;renderBodyOnly();}
  else if(el.id==="rq"){S.rq=el.value;renderBodyOnly();}
  else if(el.id==="iq"){S.iq=el.value; const o=S.orders.get(S.openId); const b=$("#iresults"); if(o&&b) b.innerHTML=itemResults(o);}
  else if(el.id==="kq"){S.kq=el.value; const b=$("#kresults"); if(b) b.innerHTML=kitResults();}
  else if(el.id==="teamQ"){teamSearch(el.value);}
  else if(el.id==="idsText"){ S.idRows=parseIds(el.value); clearTimeout(window.__idsT); window.__idsT=setTimeout(()=>{ const ta=$("#idsText"); const v=ta?ta.value:""; renderSheet(); const nt=$("#idsText"); if(nt){ nt.value=v; } },400); } });
document.addEventListener("focusin",e=>{ if(e.target.id==="teamQ"&&!e.target.value) teamSearch(""); });
document.addEventListener("change",async e=>{ const el=e.target; const o=S.openId&&(S.orders.get(S.openId)||S.closed.get(S.openId));
  try{
  if(el.id==="idsFile"&&el.files&&el.files[0]){ const txt=await el.files[0].text(); S.idRows=parseIds(txt); renderSheet(); const nt=$("#idsText"); if(nt) nt.value=txt; return; }
  if(el.id==="idept"){S.idept=el.checked; const b=$("#iresults"); if(o&&b) b.innerHTML=itemResults(o); return;}
  if(el.id==="ctype"){S.ctype=el.value;S.climit=100;renderBodyOnly();return;} if(el.id==="cdept"){S.cdept=el.value;S.climit=100;renderBodyOnly();return;}
  if(el.dataset.lk&&S.lock.mine&&S.lines){ const l=S.lines.find(x=>x.k===el.dataset.lk); if(!l) return; const f=el.dataset.lf; let v=el.value;
    if(f==="start"||f==="end"){ l[f]=v; if(l.start&&l.end&&l.end<l.start){ toast(t("badDates")); l[f]=f==="start"?l.end:l.start; } l.days=chargeDays(l.start,l.end,o.rentType,o.dpw)||l.days; }
    else { v=Math.max(0,parseFloat(v)||0); if(f==="disc") v=Math.min(100,v); if(f==="qty") v=Math.round(v); if(f==="days") v=Math.round(v*2)/2; l[f]=v; }
    linesChanged(); return; }
  if(el.dataset.sk&&S.lines&&o){ const l=S.lines.find(x=>x.k===el.dataset.sk); if(!l) return; const f=el.dataset.sf; let v=Math.max(0,Math.round(parseFloat(el.value)||0)); const max=f==="out"?(+l.qty||0):f==="dmg"?(+l.in||0):(+l.out||0); v=Math.min(v,max); if(f==="in"&&v+(+l.lost||0)>(+l.out||0)) v=(+l.out||0)-(+l.lost||0); if(f==="lost"&&v+(+l.in||0)>(+l.out||0)) v=(+l.out||0)-(+l.in||0);
    await saveStore(o,()=>{l[f]=v; if(f==="in"&&(+l.dmg||0)>v) l.dmg=v;},f==="out"?"out":"in"); return; }
  if(el.dataset.h&&o){ const k=el.dataset.h; let v=el.value; if(k==="dept") v=v?+v:""; if(k==="dpw") v=Math.max(0,Math.min(7,+v||0)); if(k==="extraDisc") v=Math.max(0,Math.min(100,+v||0)); if(k==="insurance") v=Math.max(0,+v||0);
    const patch={[k]:v}; if(k==="customerName"){ const c=[...S.cust.values()].find(x=>x.name===v); if(c){ patch.customerId=c.id; if(!o.billing) patch.billing=c.addr||""; if(!o.phone) patch.phone=c.phone||""; } }
    const nx={...o,...patch}; if(nx.ship&&nx.ret&&nx.ret<nx.ship){ toast(t("badDates")); el.value=o[k]||""; return; }
    if(["extraDisc","insurance","tax"].includes(k)) patch.totals=orderTotals(S.lines||[],nx);
    patch.updatedAt=nowISO(); patch.log=logged(o,"header"); await upd("orders/"+o.id,patch); return; }
  if(el.id==="adjustTo"&&o){ const G0=orderTotals(S.lines||[],{...o,adjust:0}); const v=el.value===""?0:r2((parseFloat(el.value)||0)-(G0.sub-G0.extra)); const nx={...o,adjust:v}; await upd("orders/"+o.id,{adjust:v,totals:orderTotals(S.lines||[],nx),updatedAt:nowISO(),log:logged(o,"header")}); return; }
  if(el.id==="fixStatus"&&o&&el.value){ await upd("orders/"+o.id,{status:el.value,updatedAt:nowISO(),log:logged(o,"status",{to:el.value})}); return; }
  if(el.dataset.roleUid){ await upd("team/"+el.dataset.roleUid,{role:el.value}); return; }
  if(el.dataset.rep){ await upd("repairs/"+el.dataset.rep,{status:el.value,updatedAt:nowISO()}); return; }
  }catch(err){} });
document.addEventListener("submit",async e=>{ e.preventDefault(); const f=e.target; try{
  if(f.id==="newOrderForm") await createOrder();
  else if(f.id==="itemForm"){ const g=id=>$("#"+id).value; const data={code:g("it-code").trim(),desc:g("it-desc").trim(),type:+g("it-type"),dept:+g("it-dept"),price:Math.max(0,+g("it-price")||0),discountable:g("it-discountable")==="1"?1:0,maxDisc:Math.max(0,Math.min(100,+g("it-maxDisc")||0)),stock:Math.max(0,Math.round(+g("it-stock")||0)),kit:kitDraft||[],updatedAt:nowISO()};
    if(!data.code||!data.desc){toast(t("needTitle"));return;} const id=S.openId?+S.openId:(-Date.now()); data.id=id; await put("catalogEdits/"+String(id).replace("-","n"),data); toast(t("saved")); closeSheet(); }
  else if(f.id==="custForm"){ const g=id=>$("#"+id).value; const data={code:g("cu-code").trim(),name:g("cu-name").trim(),tax:g("cu-tax").trim(),type:g("cu-type"),disc:Math.max(0,Math.min(100,+g("cu-disc")||0)),phone:g("cu-phone").trim(),addr:g("cu-addr").trim(),updatedAt:nowISO()};
    if(!data.name){toast(t("needCust"));return;} const id=S.openId||("n"+Date.now()); data.id=id; await put("customerEdits/"+id,data); toast(t("saved")); closeSheet(); }
  else if(f.id==="setForm"){ await put("meta/company",{name:$("#s-name").value.trim(),tax:$("#s-tax").value.trim(),addr:$("#s-addr").value.trim(),updatedAt:nowISO()}); toast(t("saved")); }
  }catch(err){} });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.sheet) closeSheet(); });
let toastT=0; function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),3200);}

/* ================= boot ================= */
async function loadClosed(){ if(S.closedLoaded) return; S.closedLoaded=true; for(const st of ["Draft INV","Cancel"]){ try{ const s=await S.db.collection("orders").where("status","==",st).limit(500).get(); for(const d of s.docs) S.closed.set(d.id,{id:d.id,...d.data()}); }catch(e){} } scheduleRender(); }
function rowsToProducts(doc){ const cols=doc.cols, out=[]; for(const r of doc.rows||[]){ const o={}; cols.forEach((c,i)=>o[c]=r[i]); out.push({id:o.id,code:o.code,desc:o.desc,dept:o.dept,type:o.type,price:+o.price||0,discountable:+o.discountable?1:0,maxDisc:+o.maxDisc||0,stock:+o.stock||0,serial:o.serial,kit:(S.kitsBase&&S.kitsBase.get(o.id))||[]}); } return out; }
async function boot(){ render(); const C=window.claude; if(!C||!C.use){S.offline=true;render();return;}
  const [db,user,dl]=await Promise.all([C.use("db"),C.use("user"),C.use("downloads")]); S.user=user; S.dl=dl;
  if(user){ S.me=await user.me(); S.admin=await user.canEdit(); const cw=await user.can("data.write"); S.canWrite=cw!==false; }
  if(!db){S.offline=true;render();return;} S.db=db;
  db.collection("orders").where("status","in",["Quote","Order","Approve","Shipped","Returned"]).limit(1000).onSnapshot(s=>{ const prevOpen=S.openId&&S.orders.get(S.openId); S.orders.clear(); for(const d of s.docs) S.orders.set(d.id,{id:d.id,...d.data()}); for(const id of S.orders.keys()) S.closed.delete(id); if(prevOpen&&!S.orders.has(prevOpen.id)){ S.closed.set(prevOpen.id,prevOpen); S.db.doc("orders/"+prevOpen.id).get().then(d=>{ if(d.exists){ S.closed.set(d.id,{id:d.id,...d.data()}); scheduleRender(); } }).catch(()=>{}); } S.loaded.orders=true; scheduleRender(); refreshProfiles(); },()=>{S.loaded.orders=true;scheduleRender();});
  db.collection("catalog").onSnapshot(s=>{ S.catBase.clear(); for(const d of s.docs) for(const p of rowsToProducts(d.data())) S.catBase.set(p.id,p); rebuildCat(); S.loaded.cat=true; scheduleRender(); },()=>{});
  db.collection("catalogEdits").onSnapshot(s=>{ S.catEdits.clear(); for(const d of s.docs){ const x=d.data(); S.catEdits.set(+x.id,x);} rebuildCat(); scheduleRender(); },()=>{});
  db.collection("kits").onSnapshot(s=>{ S.kitsBase=new Map(); for(const d of s.docs){ for(const [pid,kit] of Object.entries(d.data().kits||{})) S.kitsBase.set(+pid,kit);} for(const [pid,kit] of S.kitsBase){ const p=S.catBase.get(pid); if(p) p.kit=kit; } rebuildCat(); scheduleRender(); },()=>{});
  db.collection("customers").onSnapshot(s=>{ S.custBase.clear(); for(const d of s.docs) for(const c of d.data().rows||[]) S.custBase.set(c.id,c); rebuildCust(); S.loaded.cust=true; scheduleRender(); },()=>{});
  db.collection("customerEdits").onSnapshot(s=>{ S.custEdits.clear(); for(const d of s.docs){const x=d.data(); S.custEdits.set(isNaN(+x.id)?x.id:+x.id,x);} rebuildCust(); scheduleRender(); },()=>{});
  db.collection("crew").onSnapshot(s=>{ S.crew=[]; for(const d of s.docs) S.crew.push(...(d.data().rows||[])); scheduleRender(); },()=>{});
  db.collection("meta").onSnapshot(s=>{ for(const d of s.docs){ const x=d.data(); if(d.id==="config") Object.assign(S.cfg,x); if(d.id==="company") S.cfg.company=x; if(d.id==="sync") S.cfg.sync=x; } scheduleRender(); },()=>{});
  if(S.admin) db.doc("secure/crewIds").onSnapshot(s=>{ S.ids=(s.exists&&s.data().ids)||{}; S.idsLoaded=true; scheduleRender(); },()=>{ S.idsLoaded=false; });
  db.collection("team").onSnapshot(s=>{ S.team.clear(); for(const d of s.docs) S.team.set(d.id,{id:d.id,...d.data()}); S.loaded.team=true; scheduleRender(); refreshProfiles(); },()=>{S.loaded.team=true;});
  db.collection("repairs").orderBy("at","desc").limit(500).onSnapshot(s=>{ S.repairs.clear(); for(const d of s.docs) S.repairs.set(d.id,{id:d.id,...d.data()}); scheduleRender(); },()=>{});
  render(); }
boot();
</script>
